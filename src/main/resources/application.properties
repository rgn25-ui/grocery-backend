server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=grocery-backend

# Cloud SQL connection
spring.datasource.url=jdbc:postgresql:///${DB_NAME:grocery_db}?cloudSqlInstance=${CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Entities have no lazy relations and controllers return them directly, so no open session is needed
spring.jpa.open-in-view=false

# Connection pool
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=600000
# Must be below max-lifetime, otherwise Hikari disables it with a warning
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.initialization-fail-timeout=-1

# Health checks
management.endpoints.web.exposure.include=health
# Only the status (UP/DOWN) is public; no database details
management.endpoint.health.show-details=never

# Logging
logging.level.com.grocerylist.backend=INFO
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate=WARN